[workspace]
members = [
    "input-capture",
    "input-emulation",
    "input-event",
    "mimouse-ipc",
    "mimouse-cli",
    "mimouse-gtk",
    "mimouse-proto",
]

[package]
name = "mimouse"
description = "Software KVM Switch / mouse & keyboard sharing software for Local Area Networks"
version = "0.11.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/Cklaus1/mimouse"

[profile.release]
codegen-units = 1
lto = "fat"
strip = true
panic = "abort"

[build-dependencies]
shadow-rs = "1.2.0"

[dependencies]
input-event = { path = "input-event", version = "0.4.0" }
input-emulation = { path = "input-emulation", version = "0.4.0", default-features = false }
input-capture = { path = "input-capture", version = "0.4.0", default-features = false }
mimouse-cli = { path = "mimouse-cli", version = "0.3.0" }
mimouse-gtk = { path = "mimouse-gtk", version = "0.3.0", optional = true }
mimouse-ipc = { path = "mimouse-ipc", version = "0.3.0" }
mimouse-proto = { path = "mimouse-proto", version = "0.3.0" }
shadow-rs = { version = "1.2.0", features = ["metadata"] }

hickory-resolver = "0.25.2"
toml = "0.8"
toml_edit = { version = "0.22", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4.20"
env_logger = "0.11.3"
serde_json = "1.0.107"
tokio = { version = "1.32.0", features = [
    "io-util",
    "io-std",
    "macros",
    "net",
    "process",
    "rt",
    "sync",
    "signal",
    "time",
] }
futures = "0.3.28"
clap = { version = "4.4.11", features = ["derive"] }
slab = "0.4.9"
thiserror = "2.0.0"
tokio-util = "0.7.11"
local-channel = "0.1.5"
webrtc-dtls = { version = "0.12.0", features = ["pem"] }
webrtc-util = "0.11.0"
rustls = { version = "0.23.12", default-features = false, features = [
    "std",
    "ring",
] }
rcgen = "0.13.1"
sha2 = "0.10.8"
notify = "8.2.0"
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
] }
rustls-pki-types = { version = "1.14", features = ["std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.148"

[target.'cfg(all(unix, not(target_os="macos")))'.dependencies]
ashpd = { version = "0.13.9", default-features = false, features = [
    "clipboard",
    "remote_desktop",
    "tokio",
] }

[target.'cfg(windows)'.dependencies]
clipboard-win = { version = "5.4", features = ["monitor"] }
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "png",
] }

[features]
default = [
    "gtk",
    "layer_shell_capture",
    "x11_capture",
    "libei_capture",
    "wlroots_emulation",
    "libei_emulation",
    "rdp_emulation",
    "x11_emulation",
]
gtk = ["dep:mimouse-gtk"]
layer_shell_capture = ["input-capture/layer_shell"]
x11_capture = ["input-capture/x11"]
libei_capture = ["input-event/libei", "input-capture/libei"]
libei_emulation = ["input-event/libei", "input-emulation/libei"]
wlroots_emulation = ["input-emulation/wlroots"]
x11_emulation = ["input-emulation/x11"]
rdp_emulation = ["input-emulation/remote_desktop_portal"]

[package.metadata.bundle]
name = "MiMouse"
icon = ["target/icon.icns"]
identifier = "io.github.cklaus1.MiMouse"
osx_info_plist_exts = ["build-aux/macos-lsui-element.plist"]
resources = ["target/menubar-template.png"]

# webrtc-util 0.11.0 with webrtc-rs/webrtc#812 backported (Windows WSAECONNRESET
# tears down the DTLS listener, feschber/lan-mouse#262)
[patch.crates-io]
webrtc-util = { path = "vendor/webrtc-util" }
