name: "Release"
run-name: "Release - ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.name || github.ref_name }}"

on:
  push:
    branches: [ "main" ]
    tags:
      - v**
  workflow_dispatch:
    inputs:
      name:
        description: 'Development release name'
        required: false
        default: ''

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: mimouse-linux-x86_64
            binary: mimouse
          - os: ubuntu-22.04-arm
            artifact: mimouse-linux-arm64
            binary: mimouse
          - os: windows-latest
            artifact: mimouse-windows-x86_64.exe
            binary: mimouse.exe
          - os: macos-15-intel
            artifact: mimouse-macos-intel
            binary: mimouse
          - os: macos-15
            artifact: mimouse-macos-arm64
            binary: mimouse
    steps:
    - uses: actions/checkout@v6
    - name: install dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install libx11-dev libxtst-dev
    - name: Release Build
      run: |
        cargo build --release
        cp target/release/${{ matrix.binary }} ${{ matrix.artifact }}
    - name: Upload build artifact
      uses: actions/upload-artifact@v6
      with:
        name: ${{ matrix.artifact }}
        path: ${{ matrix.artifact }}

  release:
    name: "Release"
    needs: [build]
    runs-on: "ubuntu-latest"
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
    - name: Get short SHA
      id: vars
      run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
    - name: Create Pre-Release
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      uses: softprops/action-gh-release@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: ${{ format('{0}-{1}', github.event.inputs.name || github.ref_name, steps.vars.outputs.short_sha) }}
        name: ${{ format('{0}-{1}', github.event.inputs.name || github.ref_name, steps.vars.outputs.short_sha) }}
        prerelease: true
        generate_release_notes: true
        files: |
          mimouse-linux-x86_64/mimouse-linux-x86_64
          mimouse-linux-arm64/mimouse-linux-arm64
          mimouse-macos-intel/mimouse-macos-intel
          mimouse-macos-arm64/mimouse-macos-arm64
          mimouse-windows-x86_64.exe/mimouse-windows-x86_64.exe
    - name: Create Tagged Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        name: ${{ github.ref_name }}
        generate_release_notes: true
        files: |
          mimouse-linux-x86_64/mimouse-linux-x86_64
          mimouse-linux-arm64/mimouse-linux-arm64
          mimouse-macos-intel/mimouse-macos-intel
          mimouse-macos-arm64/mimouse-macos-arm64
          mimouse-windows-x86_64.exe/mimouse-windows-x86_64.exe
