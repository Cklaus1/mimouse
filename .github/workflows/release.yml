name: "Release"
run-name: "Release - ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.name || github.ref_name }}"

on:
  push:
    branches: [ "main" ]
    tags:
      - v**
  workflow_dispatch:
    inputs:
      name:
        description: 'Development release name'
        required: false
        default: ''

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: mimouse-linux-x86_64
            binary: mimouse
            packages: true
          - os: ubuntu-22.04-arm
            artifact: mimouse-linux-arm64
            binary: mimouse
            packages: true
          - os: windows-latest
            artifact: mimouse-windows-x86_64.exe
            binary: mimouse.exe
          - os: macos-15-intel
            artifact: mimouse-macos-intel
            binary: mimouse
          - os: macos-15
            artifact: mimouse-macos-arm64
            binary: mimouse
    steps:
    - uses: actions/checkout@v6
    - name: install dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install libx11-dev libxtst-dev
    - name: Release Build
      run: cargo build --release
      env:
        # the collector built in for `mimouse cli telemetry on`: tagged
        # releases only, never `main-<sha>` pre-releases
        MIMOUSE_TELEMETRY_URL: ${{ startsWith(github.ref, 'refs/tags/') && vars.MIMOUSE_TELEMETRY_URL || '' }}
    - name: Copy build artifact
      run: cp target/release/${{ matrix.binary }} ${{ matrix.artifact }}
    - name: Upload build artifact
      uses: actions/upload-artifact@v6
      with:
        name: ${{ matrix.artifact }}
        path: ${{ matrix.artifact }}
    - name: Install cargo-deb and cargo-generate-rpm
      if: matrix.packages
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-deb,cargo-generate-rpm
    - name: Build .deb and .rpm
      if: matrix.packages
      run: |
        cargo deb --no-build
        cargo generate-rpm
        mkdir packages
        cp target/debian/*.deb target/generate-rpm/*.rpm packages/
        dpkg-deb --info packages/*.deb
        dpkg-deb --contents packages/*.deb
    - name: Upload packages
      if: matrix.packages
      uses: actions/upload-artifact@v6
      with:
        name: packages-${{ matrix.artifact }}
        path: packages/*

  release:
    name: "Release"
    needs: [build]
    runs-on: "ubuntu-latest"
    steps:
    - uses: actions/checkout@v6
      with:
        path: src
    - name: Download build artifacts
      uses: actions/download-artifact@v4
    - name: Get short SHA
      id: vars
      run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
    - name: Render package manifests
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        curl -fsSL -o source.tar.gz "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
        python3 -m venv "$RUNNER_TEMP/venv"
        "$RUNNER_TEMP/venv/bin/pip" install --quiet jsonschema pyyaml
        "$RUNNER_TEMP/venv/bin/python" src/packaging/render-manifests.py \
          --version "${GITHUB_REF_NAME#v}" \
          --windows-exe mimouse-windows-x86_64.exe/mimouse-windows-x86_64.exe \
          --source-tarball source.tar.gz \
          --out manifests --validate
        ruby -wc manifests/homebrew/mimouse.rb
    - name: Create Pre-Release
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      uses: softprops/action-gh-release@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: ${{ format('{0}-{1}', github.event.inputs.name || github.ref_name, steps.vars.outputs.short_sha) }}
        name: ${{ format('{0}-{1}', github.event.inputs.name || github.ref_name, steps.vars.outputs.short_sha) }}
        prerelease: true
        generate_release_notes: true
        files: |
          mimouse-linux-x86_64/mimouse-linux-x86_64
          mimouse-linux-arm64/mimouse-linux-arm64
          mimouse-macos-intel/mimouse-macos-intel
          mimouse-macos-arm64/mimouse-macos-arm64
          mimouse-windows-x86_64.exe/mimouse-windows-x86_64.exe
          packages-*/*.deb
          packages-*/*.rpm
    - name: Create Tagged Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        name: ${{ github.ref_name }}
        generate_release_notes: true
        files: |
          mimouse-linux-x86_64/mimouse-linux-x86_64
          mimouse-linux-arm64/mimouse-linux-arm64
          mimouse-macos-intel/mimouse-macos-intel
          mimouse-macos-arm64/mimouse-macos-arm64
          mimouse-windows-x86_64.exe/mimouse-windows-x86_64.exe
          packages-*/*.deb
          packages-*/*.rpm
          manifests/scoop/mimouse.json
          manifests/homebrew/mimouse.rb
          manifests/winget/*.yaml
