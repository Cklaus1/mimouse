name = "mimouse-telemetry"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Privacy: no Workers Logs, traces, Logpush or preview URLs. The Worker never
# logs; keep it that way (README "Privacy").
logpush = false
preview_urls = false

[observability]
enabled = false
head_sampling_rate = 0

[observability.logs]
enabled = false
invocation_logs = false
persist = false

[observability.traces]
enabled = false
persist = false

# needs-human: replace with the id printed by `wrangler d1 create mimouse-telemetry`.
[[d1_databases]]
binding = "DB"
database_name = "mimouse-telemetry"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Daily purge of rows older than 90 days.
[triggers]
crons = ["17 3 * * *"]

[vars]
MAX_BATCHES_PER_DAY = "10"

# needs-human: serve on your own domain, e.g.
# routes = [{ pattern = "telemetry.example.org", custom_domain = true }]
# workers_dev = false
