[package]
name = "mimouse-cli"
description = "CLI Frontend for mimouse"
version = "0.3.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/Cklaus1/mimouse"

[dependencies]
futures = "0.3.30"
mimouse-ipc = { path = "../mimouse-ipc", version = "0.3.0" }
clap = { version = "4.4.11", features = ["derive"] }
thiserror = "2.0.0"
tokio = { version = "1.32.0", features = [
    "io-util",
    "io-std",
    "macros",
    "net",
    "rt",
] }
