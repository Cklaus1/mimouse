[package]
name = "mimouse-gtk"
description = "GTK4 / Libadwaita Frontend for mimouse"
version = "0.3.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/Cklaus1/mimouse"

[dependencies]
gtk = { package = "gtk4", version = "0.9.0", features = ["v4_2"] }
adw = { package = "libadwaita", version = "0.7.0", features = ["v1_1"] }
async-channel = { version = "2.1.1" }
hostname = "0.4.0"
log = "0.4.20"
mimouse-ipc = { path = "../mimouse-ipc", version = "0.3.0" }
thiserror = "2.0.0"

[build-dependencies]
glib-build-tools = { version = "0.20.0" }
